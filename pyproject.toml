[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-project"
version = "0.1.0"
description = "Subject-invariant and reliability-aware multimodal emotion recognition research prototype."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.3",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
emotion-project = "emotion_project.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

